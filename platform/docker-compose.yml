services:
  api:
    build: .
    env_file: .env
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [db]
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in shell or .env}
      POSTGRES_DB: infinite360
    volumes: ["pgdata:/var/lib/postgresql/data", "./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
volumes: { pgdata: {} }
