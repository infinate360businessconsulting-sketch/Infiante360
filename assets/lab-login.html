<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Practice Lab sign-in | Infiante360</title>
<style>:root{--bg:#F8FAFC;--ink:#0F172A;--mut:#64748B;--pri:#4F46E5;--bd:#E2E8F0}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);display:grid;place-items:center;min-height:100vh;padding:16px}
main{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:28px;max-width:420px;width:100%;box-shadow:0 8px 30px rgba(15,23,42,.08)}h1{font-size:1.4rem;margin:0 0 6px}p{color:var(--mut);line-height:1.5}
label{display:block;font-weight:700;margin-top:14px;font-size:.9rem}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--bd);border-radius:10px;font-size:1rem;margin-top:6px}
button{margin-top:18px;width:100%;padding:13px;border:0;border-radius:999px;background:var(--pri);color:#fff;font-weight:700;font-size:1rem;cursor:pointer}#msg{margin-top:12px;min-height:1.2em;font-size:.92rem}.err{color:#B91C1C}small{display:block;margin-top:16px;color:var(--mut)}a{color:var(--pri)}</style></head><body>
<main><h1>Infiante360 Practice Lab</h1><p>Free beta by invitation. Sign in with your email and the invite code we sent you.</p>
<form id="f"><label for="e">Email</label><input id="e" type="email" autocomplete="email" required><label for="c">Invite code</label><input id="c" autocomplete="one-time-code" required>
<button type="submit">Sign in</button><div id="msg" role="status" aria-live="polite"></div></form>
<small>No invite yet? <a href="/lp/labs.html">Join the waitlist</a>. This is a learning simulation, not the real Adobe product, and no credential, job or exam result is promised.</small></main>
<script>document.getElementById('f').addEventListener('submit',async function(ev){ev.preventDefault();var m=document.getElementById('msg');m.className='';m.textContent='Checking...';
try{var r=await fetch('/api/lab-login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('e').value,code:document.getElementById('c').value})});var j=await r.json();
if(j.ok){location.href=j.next}else{m.className='err';m.textContent=j.error||'Could not sign in.'}}catch(e){m.className='err';m.textContent='Network error. Try again.'}});</script></body></html>
