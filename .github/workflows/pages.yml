name: Build and deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 19 * * *"   # 01:00 IST daily: rebuild so expired cohort dates drop off automatically
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SEO dataset tests (counts, mapping integrity, no invented metrics, secret patterns)
        run: python3 -m unittest discover -s tests -v
      - name: Build and validate (fails on broken links, duplicate titles, invalid JSON-LD)
        env:
          SITE_BASE: https://infiante360techacademy.com/
        run: python3 src/build.py _site
      - name: Google verification tags are served (served != verified; Search Console confirms ownership)
        run: python3 scripts/check_head_tags.py _site
      - name: SEO inventory and health checks (read-only, computed from built files)
        run: |
          python3 scripts/seo_inventory.py _site seo-report https://infiante360techacademy.com
          cat seo-report/seo-health.md >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/seo_report_print.py seo-report
      - name: Run deterministic agent pipeline on the built site (read-only; never deploys)
        run: |
          python3 agents/orchestrator.py pipeline --built _site
          python3 agents/orchestrator.py status
          for f in content_freshness structured_data security_privacy; do echo "## $f"; head -c 2500 data/agents/out/$f.json; echo; done
      - uses: actions/upload-artifact@v4
        with:
          name: seo-report
          path: seo-report
      - name: Add the separate LMS site (static, built from lms-site/) at /lms-hub/
        run: mkdir -p _site/lms-hub && cp -r lms-site/*.html lms-site/assets _site/lms-hub/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
